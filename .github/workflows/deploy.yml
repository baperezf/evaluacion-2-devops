name: CI/CD Pipeline - Proyecto Semestral DevOps

on:
  push:
    branches:
      - deploy # Se activa únicamente al enviar cambios a la rama deploy

jobs:
  # =========================================================
  # ETAPA 1: COMPILAR Y PUBLICAR IMÁGENES (CI)
  # =========================================================
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Autenticarse en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # --- Construcción y subida del Backend Ventas ---
      - name: Construir y Subir Backend Ventas
        uses: docker/build-push-action@v5
        with:
          context: ./back-Ventas_SpringBoot/Springboot-API-REST
          push: true
          tags: ${{ secrets.DOCKER_HUB_USER }}/proyecto-back-ventas:latest

      # --- Construcción y subida del Backend Despachos ---
      - name: Construir y Subir Backend Despachos
        uses: docker/build-push-action@v5
        with:
          context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          push: true
          tags: ${{ secrets.DOCKER_HUB_USER }}/proyecto-back-despachos:latest

      # --- Construcción y subida del Frontend ---
      - name: Construir y Subir Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./front_despacho
          push: true
          tags: ${{ secrets.DOCKER_HUB_USER }}/proyecto-frontend:latest

  # =========================================================
  # ETAPA 2: DESPLIEGUE AUTOMÁTICO EN AWS (CD)
  # =========================================================
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # --- Despliegue en la Instancia del Frontend ---
      - name: Desplegar Frontend en EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "13.220.129.95" 
          username: ec2-user    
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker stop proyecto-frontend || true
            sudo docker rm proyecto-frontend || true
            sudo docker pull ${{ secrets.DOCKER_HUB_USER }}/proyecto-frontend:latest
            sudo docker run -d --name proyecto-frontend -p 8080:80 ${{ secrets.DOCKER_HUB_USER }}/proyecto-frontend:latest

      # --- Despliegue en la Instancia del Backend ---
      - name: Desplegar Microservicios en EC2 Backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "13.220.44.34" 
          username: ec2-user    
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker stop proyecto-back-ventas proyecto-back-despachos || true
            sudo docker rm proyecto-back-ventas proyecto-back-despachos || true
            sudo docker pull ${{ secrets.DOCKER_HUB_USER }}/proyecto-back-ventas:latest
            sudo docker pull ${{ secrets.DOCKER_HUB_USER }}/proyecto-back-despachos:latest
            
            sudo docker run -d --name proyecto-back-ventas -p 8081:8080 -e SPRING_DATASOURCE_URL=jdbc:mysql://172.31.5.237:3306/db_despachos_ventas?useSSL=false ${{ secrets.DOCKER_HUB_USER }}/proyecto-back-ventas:latest
            sudo docker run -d --name proyecto-back-despachos -p 8082:8080 -e SPRING_DATASOURCE_URL=jdbc:mysql://172.31.5.237:3306/db_despachos_ventas?useSSL=false ${{ secrets.DOCKER_HUB_USER }}/proyecto-back-despachos:latest