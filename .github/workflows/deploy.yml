name: Pipeline CI/CD Innovatech AWS (ECS Fargate)

on:
  push:
    branches:
      - deploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Iniciar sesion en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compilar y Subir Frontend a ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/proyecto-frontend:latest ./front_despacho
          docker push $ECR_REGISTRY/proyecto-frontend:latest

      - name: Compilar y Subir Backend Ventas a ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/proyecto-back-ventas:latest ./back-Ventas_SpringBoot/Springboot-API-REST
          docker push $ECR_REGISTRY/proyecto-back-ventas:latest

      - name: Compilar y Subir Backend Despachos a ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/proyecto-back-despachos:latest ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          docker push $ECR_REGISTRY/proyecto-back-despachos:latest
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Iniciar sesion en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 1. Renderizar la imagen del Frontend (Sin el prefijo de la subcarpeta)
      - name: Actualizar Frontend en Definicion de Tarea
        id: render-front
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: proyecto-frontend
          image: ${{ steps.login-ecr.outputs.registry }}/proyecto-frontend:latest

      # 2. Renderizar la imagen de Ventas (Aquí sigue heredando dinámicamente)
      - name: Actualizar Ventas en Definicion de Tarea
        id: render-ventas
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.render-front.outputs.task-definition }}
          container-name: proyecto-back-ventas
          image: ${{ steps.login-ecr.outputs.registry }}/proyecto-back-ventas:latest

      # 3. Renderizar la imagen de Despachos
      - name: Actualizar Despachos en Definicion de Tarea
        id: render-despachos
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ secrets.render-ventas.outputs.task-definition || steps.render-ventas.outputs.task-definition }}
          container-name: proyecto-back-despachos
          image: ${{ steps.login-ecr.outputs.registry }}/proyecto-back-despachos:latest

      # 4. Desplegar el archivo final consolidado en Amazon ECS
      - name: Desplegar en Amazon ECS (Fargate)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-despachos.outputs.task-definition }}
          service: innovatech-service
          cluster: cluster-innovatech
          wait-for-service-stability: false